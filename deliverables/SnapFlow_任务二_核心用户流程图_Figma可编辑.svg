<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F9FD"/>
      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4776FF"/>
      <stop offset="1" stop-color="#6B4EFF"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF1FF"/>
      <stop offset="1" stop-color="#F2ECFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#24416B" flood-opacity="0.10"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#24416B" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8DA2C0"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7357EA"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .title { font-size: 42px; font-weight: 700; fill: #102A43; }
      .subtitle { font-size: 18px; font-weight: 400; fill: #627D98; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #4776FF; }
      .step { font-size: 12px; font-weight: 700; letter-spacing: 1px; fill: #4776FF; }
      .card-title { font-size: 20px; font-weight: 700; fill: #16324F; }
      .card-copy { font-size: 14px; font-weight: 400; fill: #6B7C93; }
      .white-title { font-size: 20px; font-weight: 700; fill: #FFFFFF; }
      .white-copy { font-size: 14px; font-weight: 400; fill: #E6ECFF; }
      .label { font-size: 13px; font-weight: 700; fill: #5C6F8A; }
      .tiny { font-size: 12px; font-weight: 400; fill: #829AB1; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1490" cy="70" r="170" fill="#E8EEFF" opacity="0.65"/>
  <circle cx="1530" cy="50" r="95" fill="#EEE9FF" opacity="0.9"/>

  <!-- Header -->
  <g id="header">
    <rect x="72" y="55" width="176" height="32" rx="16" fill="#E7EFFF"/>
    <text x="160" y="76" text-anchor="middle" class="eyebrow">DAY 1 · TASK 02</text>
    <text x="72" y="137" class="title">SnapFlow 核心用户流程</text>
    <text x="72" y="171" class="subtitle">将截图中“未被处理的意图”，转化为一个会被跟进和完成的行动</text>
  </g>

  <!-- Main canvas -->
  <g id="main-flow" filter="url(#shadow)">
    <rect x="72" y="211" width="1456" height="565" rx="28" fill="#FFFFFF"/>
  </g>

  <!-- Phase labels -->
  <g id="phase-labels">
    <rect x="104" y="241" width="176" height="30" rx="15" fill="#EDF3FF"/>
    <text x="192" y="261" text-anchor="middle" class="label">INPUT · 触发</text>
    <rect x="328" y="241" width="628" height="30" rx="15" fill="#F1EDFF"/>
    <text x="642" y="261" text-anchor="middle" class="label">REASON · 理解与决策</text>
    <rect x="1000" y="241" width="180" height="30" rx="15" fill="#EAF8F4"/>
    <text x="1090" y="261" text-anchor="middle" class="label">HUMAN · 确认</text>
    <rect x="1224" y="241" width="272" height="30" rx="15" fill="#FFF3E4"/>
    <text x="1360" y="261" text-anchor="middle" class="label">ACT · 执行</text>
  </g>

  <!-- Connectors top row -->
  <g id="top-connectors" fill="none" stroke="#8DA2C0" stroke-width="3" marker-end="url(#arrow)">
    <path d="M 284 367 H 328"/>
    <path d="M 508 367 H 552"/>
    <path d="M 732 367 H 776"/>
    <path d="M 956 367 H 1000"/>
    <path d="M 1180 367 H 1224"/>
  </g>

  <!-- Card 1 -->
  <g id="step-01-upload" filter="url(#smallShadow)">
    <rect x="104" y="299" width="180" height="136" rx="18" fill="#FFFFFF" stroke="#D9E4F2"/>
    <circle cx="132" cy="327" r="17" fill="#E8F0FF"/>
    <path d="M125 330h14M132 323v14" stroke="#4776FF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="158" y="331" class="step">STEP 01</text>
    <text x="124" y="370" class="card-title">上传截图</text>
    <text x="124" y="397" class="card-copy">用户主动选择</text>
    <text x="124" y="419" class="card-copy">一张待处理截图</text>
  </g>

  <!-- Card 2 -->
  <g id="step-02-understand" filter="url(#smallShadow)">
    <rect x="328" y="299" width="180" height="136" rx="18" fill="url(#agent)" stroke="#D8D0FF"/>
    <circle cx="356" cy="327" r="17" fill="#DCD3FF"/>
    <path d="M349 329c3-10 11-10 14 0M352 333h8" stroke="#6B4EFF" stroke-width="2.3" fill="none" stroke-linecap="round"/>
    <text x="382" y="331" class="step">STEP 02</text>
    <text x="348" y="370" class="card-title">AI 理解截图</text>
    <text x="348" y="397" class="card-copy">识别类型、标题</text>
    <text x="348" y="419" class="card-copy">时间、地点与截止日</text>
  </g>

  <!-- Card 3 -->
  <g id="step-03-intent" filter="url(#smallShadow)">
    <rect x="552" y="299" width="180" height="136" rx="18" fill="url(#primary)"/>
    <circle cx="580" cy="327" r="17" fill="#FFFFFF" opacity="0.18"/>
    <path d="M573 327h14M580 320v14" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round"/>
    <text x="606" y="331" class="step" style="fill:#DDE4FF">STEP 03</text>
    <text x="572" y="370" class="white-title">判断用户意图</text>
    <text x="572" y="397" class="white-copy">活动 · 任务 · 资料</text>
    <text x="572" y="419" class="white-copy">或无法判断</text>
  </g>

  <!-- Card 4 -->
  <g id="step-04-propose" filter="url(#smallShadow)">
    <rect x="776" y="299" width="180" height="136" rx="18" fill="#FFFFFF" stroke="#D9E4F2"/>
    <circle cx="804" cy="327" r="17" fill="#E5F7F1"/>
    <path d="M797 327l5 5 9-11" stroke="#1A9B78" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="830" y="331" class="step">STEP 04</text>
    <text x="796" y="370" class="card-title">建议下一步</text>
    <text x="796" y="397" class="card-copy">创建日程、任务</text>
    <text x="796" y="419" class="card-copy">收藏或向用户询问</text>
  </g>

  <!-- Card 5 -->
  <g id="step-05-confirm" filter="url(#smallShadow)">
    <rect x="1000" y="299" width="180" height="136" rx="18" fill="#F3FBF8" stroke="#BDE7D9"/>
    <circle cx="1028" cy="327" r="17" fill="#DDF4EC"/>
    <path d="M1021 327l5 5 9-11" stroke="#168B6C" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1054" y="331" class="step" fill="#168B6C">STEP 05</text>
    <text x="1020" y="370" class="card-title">用户确认</text>
    <text x="1020" y="397" class="card-copy">确认、修改</text>
    <text x="1020" y="419" class="card-copy">或拒绝 Agent 建议</text>
  </g>

  <!-- Card 6 -->
  <g id="step-06-action" filter="url(#smallShadow)">
    <rect x="1224" y="299" width="272" height="136" rx="18" fill="#FFF9EF" stroke="#F4D7A8"/>
    <circle cx="1252" cy="327" r="17" fill="#FFEDCC"/>
    <path d="M1244 327h16M1252 319v16" stroke="#C47A0A" stroke-width="2.5" stroke-linecap="round"/>
    <text x="1278" y="331" class="step" fill="#B76A00">STEP 06</text>
    <text x="1244" y="370" class="card-title">调用工具执行</text>
    <text x="1244" y="397" class="card-copy">飞书日程 · 待办 · 收藏</text>
    <text x="1244" y="419" class="card-copy">仅执行经用户批准的动作</text>
  </g>

  <!-- Uncertainty branch -->
  <g id="uncertainty-loop">
    <path d="M642 435 V493 H804" fill="none" stroke="#7357EA" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrowPurple)"/>
    <rect x="776" y="471" width="288" height="72" rx="16" fill="#F5F1FF" stroke="#D9CEFF"/>
    <circle cx="807" cy="507" r="17" fill="#E3D9FF"/>
    <text x="807" y="513" text-anchor="middle" font-size="20" font-weight="700" fill="#6B4EFF">?</text>
    <text x="836" y="500" class="card-title" font-size="17">信息不确定</text>
    <text x="836" y="523" class="card-copy">请用户补充，不猜测</text>
    <path d="M776 507 H682 V435" fill="none" stroke="#7357EA" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrowPurple)"/>
    <text x="688" y="478" class="tiny" fill="#7357EA">回到判断</text>
  </g>

  <!-- Long-term agent loop -->
  <g id="follow-up-loop">
    <rect x="104" y="589" width="1392" height="142" rx="21" fill="#102A43"/>
    <text x="136" y="623" font-size="13" font-weight="700" letter-spacing="1.4" fill="#8FB3FF">LONG-RUNNING AGENT LOOP</text>
    <text x="136" y="660" font-size="23" font-weight="700" fill="#FFFFFF">执行后不结束：记住状态，并在未来继续推动任务完成</text>

    <g id="memory-chip">
      <rect x="136" y="681" width="250" height="32" rx="16" fill="#1B3B5B"/>
      <circle cx="157" cy="697" r="6" fill="#6EA8FF"/>
      <text x="175" y="702" font-size="13" font-weight="700" fill="#E8F1FF">保存任务与用户偏好</text>
    </g>
    <g id="timer-chip">
      <rect x="410" y="681" width="240" height="32" rx="16" fill="#1B3B5B"/>
      <circle cx="431" cy="697" r="6" fill="#A78BFA"/>
      <text x="449" y="702" font-size="13" font-weight="700" fill="#E8F1FF">到期时自动重新触发</text>
    </g>
    <g id="observe-chip">
      <rect x="674" y="681" width="230" height="32" rx="16" fill="#1B3B5B"/>
      <circle cx="695" cy="697" r="6" fill="#4FD1C5"/>
      <text x="713" y="702" font-size="13" font-weight="700" fill="#E8F1FF">观察完成情况与反馈</text>
    </g>
    <g id="adapt-chip">
      <rect x="928" y="681" width="242" height="32" rx="16" fill="#1B3B5B"/>
      <circle cx="949" cy="697" r="6" fill="#F6AD55"/>
      <text x="967" y="702" font-size="13" font-weight="700" fill="#E8F1FF">调整提醒时间和下一步</text>
    </g>
    <g id="finish-chip">
      <rect x="1194" y="681" width="270" height="32" rx="16" fill="#214A48"/>
      <circle cx="1215" cy="697" r="6" fill="#68D391"/>
      <text x="1233" y="702" font-size="13" font-weight="700" fill="#E8FFF4">用户完成后关闭循环</text>
    </g>
  </g>

  <!-- Footer -->
  <g id="footer">
    <text x="72" y="831" class="tiny">AGENT 特征：多模态理解 · 动态决策 · 工具调用 · 长期记忆 · 主动触发 · Human-in-the-loop</text>
    <rect x="1324" y="807" width="204" height="42" rx="21" fill="#E7EFFF"/>
    <text x="1426" y="833" text-anchor="middle" font-size="14" font-weight="700" fill="#4776FF">SnapFlow · MVP V0.1</text>
  </g>
</svg>
